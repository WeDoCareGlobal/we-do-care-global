name: Contact API tests
on:
  push:
    branches: [main]
    paths:
      - 'api/contact.js'
      - 'tests/contact.test.js'
      - '.github/workflows/contact-tests.yml'
  pull_request:
    paths:
      - 'api/contact.js'
      - 'tests/contact.test.js'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate and run tests
        run: |
          node --check api/contact.js
          node --check tests/contact.test.js
          node --test tests/contact.test.js
