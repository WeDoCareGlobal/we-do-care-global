name: Pages

# Deploys the static docs site to GitHub Pages (main:/docs)
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - scripts/check_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate static site
        run: |
          python3 scripts/check_site.py docs
          node --check docs/app.js
          node --check docs/shared.js
          node --check docs/project-demos.js
      - name: Trigger Pages build via API
        run: |
          echo "Triggering GitHub Pages build for main:/docs"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
          echo "Pages build triggered successfully"
